<!DOCTYPE html>
<!-- 文件职责：厂家、模型、语言、API Key、两层思考、划词触发方式与主题设置控件。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>说文 · LingoClarify</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body class="lc-theme" data-lc-theme="cobalt">
<div class="container">
  <header class="brand-header">
    <span class="lc-brand-icon" aria-hidden="true"></span>
    <div><h1 class="title">说文</h1><p class="brand-subtitle">LingoClarify <span class="version">v4.6.0</span></p></div>
  </header>
  <p id="catalog-status" class="catalog-error" role="alert" hidden></p>
  <div id="disabled-extension" class="section" hidden>
    <p class="hint">扩展当前已停用。</p>
    <button type="button" id="enable-extension" class="fetch-btn">启用扩展</button>
  </div>

  <!-- ═══ 标签切换 ═══ -->
  <div class="tab-bar" role="tablist" aria-label="配置用途">
    <button type="button" class="tab-btn active" id="tab-explain" role="tab" aria-selected="true" aria-controls="panel-explain" data-tab="explain"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 6c-3-3-7-3-10-2v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-3-1-7-1-10 2Zm0 0v15"/></svg>解释</button>
    <button type="button" class="tab-btn" id="tab-translate" role="tab" aria-selected="false" aria-controls="panel-translate" data-tab="translate"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5h12M9 2v3M5 5c1 5 4 8 8 10M13 5c-1 5-4 8-8 10M14 21l4-10 4 10M15.5 18h5"/></svg>全文翻译</button>
  </div>

  <!-- ═══ 解释标签设置 ═══ -->
  <div class="tab-panel active" id="panel-explain" role="tabpanel" aria-labelledby="tab-explain">
    <div class="section field-pair">
      <div><label class="label" for="explain-manufacturer">模型厂家</label>
      <select id="explain-manufacturer" class="select" aria-controls="explain-model"></select></div>
      <div><label class="label" for="explain-language">解释语言</label>
      <select id="explain-language" class="select">
        <option value="auto">自动（推荐）</option><option value="zh">中文</option><option value="en">English</option>
      </select></div>
    </div>
    <div class="section">
      <label class="label" for="explain-model">模型</label>
      <select id="explain-model" class="select" aria-describedby="explain-model-detail"></select>
      <p id="explain-model-detail" class="hint"></p>

    </div>

    <div class="section" id="explain-deepseek-thinking-section" hidden>
      <label class="toggle-label">
        <input type="checkbox" id="explain-deepseek-thinking" aria-describedby="explain-deepseek-thinking-hint" aria-controls="explain-thinking">
        <span class="toggle-text">DeepSeek 思考模式</span>
      </label>
      <p class="hint" id="explain-deepseek-thinking-hint">开启后允许模型思考；关闭后禁止思考，深度思考也不可开启。</p>
    </div>

    <div class="section">
      <label class="toggle-label">
        <input type="checkbox" id="explain-thinking">
        <span class="toggle-text">深度思考模式</span>
      </label>
    </div>

    <div class="section" id="explain-effort-section" style="display:none">
      <label class="label" for="explain-effort">思考强度</label>
      <select id="explain-effort" class="select">
        <option value="high">高（推荐）</option>
        <option value="medium">中</option>
        <option value="low">低</option>
      </select>
    </div>

  </div>

  <!-- ═══ 翻译标签设置 ═══ -->
  <div class="tab-panel" id="panel-translate" role="tabpanel" aria-labelledby="tab-translate" hidden>
    <div class="section field-pair">
      <div><label class="label" for="translate-manufacturer">模型厂家</label>
      <select id="translate-manufacturer" class="select" aria-controls="translate-model"></select></div>
      <div><label class="label" for="target-language">翻译目标语言</label>
      <select id="target-language" class="select">
        <option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option>
        <option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="pt">Português</option><option value="ru">Русский</option><option value="ar">العربية</option>
      </select></div>
    </div>
    <div class="section">
      <label class="label" for="translate-model">模型</label>
      <select id="translate-model" class="select" aria-describedby="translate-model-detail"></select>
      <p id="translate-model-detail" class="hint"></p>

    </div>

    <div class="section" id="translate-deepseek-thinking-section" hidden>
      <label class="toggle-label">
        <input type="checkbox" id="translate-deepseek-thinking" aria-describedby="translate-deepseek-thinking-hint" aria-controls="translate-thinking">
        <span class="toggle-text">DeepSeek 思考模式</span>
      </label>
      <p class="hint" id="translate-deepseek-thinking-hint">开启后允许模型思考；关闭后禁止思考，深度思考也不可开启。</p>
    </div>

    <div class="section">
      <label class="toggle-label">
        <input type="checkbox" id="translate-thinking">
        <span class="toggle-text">深度思考模式</span>
      </label>
    </div>

    <div class="section" id="translate-effort-section" style="display:none">
      <label class="label" for="translate-effort">思考强度</label>
      <select id="translate-effort" class="select">
        <option value="high">高（推荐）</option>
        <option value="medium">中</option>
        <option value="low">低</option>
      </select>
    </div>

  </div>

  <div class="section" id="trigger-mode-section">
    <label class="label" for="trigger-mode">划词触发方式</label>
    <select id="trigger-mode" class="select" aria-describedby="trigger-mode-hint">
      <option value="auto">选中文字后自动弹出（默认）</option>
      <option value="contextMenu">仅右键菜单触发</option>
    </select>
    <p class="hint" id="trigger-mode-hint">选中文字后，右键选择“📖 说文：解释选中文字”。此设置同时适用于两个标签的划词回答。</p>
  </div>

  <div class="section key-section">
    <div id="key-editor">
      <label class="label" for="api-key">API Key</label>
      <input type="password" id="api-key" class="input" autocomplete="off" spellcheck="false">
      <p class="hint">填写所选厂家的 Key，保存后自动收起。</p>
      <div class="key-actions">
        <button type="button" id="save-key" class="mini-btn">保存 API Key</button>
        <button type="button" id="cancel-key" class="mini-btn" hidden>取消</button>
      </div>
      <p id="key-msg" class="inline-error" role="alert"></p>
    </div>
    <div id="key-saved" class="key-saved" hidden><span>API Key 已保存</span><button type="button" id="rewrite-key" class="mini-btn" hidden>重新填写</button></div>
  </div>
  <button type="button" id="custom-connection-button" class="connection-link" hidden>配置自定义接口</button>
  <dialog id="custom-connection-dialog">
    <h2>自定义接口</h2>
    <label class="label" for="api-base-url">接口地址</label>
    <input type="url" id="api-base-url" class="input" placeholder="https://example.com/v1" autocomplete="off">
    <p class="hint">填写服务商提供的兼容地址。</p>
    <p id="custom-msg" class="inline-error" role="alert"></p>
    <div class="key-actions">
      <button type="button" id="custom-save" class="mini-btn">保存地址</button>
      <button type="button" id="custom-cancel" class="mini-btn">取消</button>
    </div>
  </dialog>

  <button type="button" id="save-btn" class="save-btn">保存设置</button>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div class="theme-section">
    <label class="label" for="ui-theme">主题风格</label>
    <select id="ui-theme" class="select" aria-describedby="theme-status"><option value="cobalt">钴蓝纸页（默认）</option><option value="playful">蜜桃涂鸦</option><option value="vellum">靛蓝手稿</option></select>
    <p id="theme-status" class="hint" role="status" aria-live="polite">切换后自动保存</p>
  </div>
</div>

<script src="model-catalog.js"></script>
<script src="config.js"></script>
<script src="theme.js"></script>
<script src="popup.js"></script>
</body>
</html>

<!--
中文逐句导读（不参与运行）

一、这个文件在项目中做什么
设置页骨架：放置标签、下拉框、输入框、按钮和提示区域。
本文件描述有什么控件；popup.css 决定外观；popup.js 决定点击后做什么。
id 是控件的名字，class 用于样式，aria 属性帮助屏幕阅读器理解控件。

二、先认识常见写法
HTML 标签描述界面结构；起始标签创建元素，斜线结尾标签结束元素。
id 给元素一个名字，JavaScript 用它找控件；class 把元素与 CSS 样式关联。
select/option 是下拉框和选项，input 是输入框或复选框，button 是按钮。
hidden 表示初始不显示；aria/role 提供辅助阅读信息，不负责保存配置。
本文件不发模型请求，按钮点击的实际处理由 popup.js 绑定。

三、按原代码顺序逐句看
行号对应本文件上方原代码；空行和原有说明不重复解释。
同一行有多句时按先后用分号分开；跨行表达式在起始行解释，并标明续行。

四、入口清单 manifest.json 的逐行说明
JSON 不允许注释，因此清单保持原样，说明集中在这里。
第 1 行：开始整份扩展清单。
第 2 行：使用 Manifest V3 扩展规范。
第 3 行：浏览器显示的扩展名称。
第 4 行：当前扩展版本。
第 5 行：扩展功能简介。
第 6 行：允许本地存储、下载、右键菜单和脚本注入；分别供设置、笔记和网页入口使用。
第 7 行：申请所有网址的主机访问权限，用于适用网页和所配置模型接口；实际注入仍受浏览器限制。
第 8 行：开始声明后台入口。
第 9 行：以 background.js 作为按需运行的后台服务工作线程。
第 10 行：结束后台声明。

第 12 行：开始一组网页加载规则。
第 13 行：匹配所有适用网址，内部页面等仍受浏览器限制。
