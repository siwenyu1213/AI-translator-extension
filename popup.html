<!DOCTYPE html>
<!-- 文件职责：厂家、模型、语言、API Key、两层思考、划词触发方式与主题设置控件。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>说文 · LingoClarify</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body class="lc-theme" data-lc-theme="cobalt">
<div class="container">
  <header class="brand-header">
    <div><h1 class="title">说文</h1><p class="brand-subtitle">LingoClarify <span class="version">v1.0.0</span></p></div>
  </header>
  <p id="catalog-status" class="catalog-error" role="alert" hidden></p>
  <div id="disabled-extension" class="section" hidden>
    <p class="hint">扩展当前已停用。</p>
    <button type="button" id="enable-extension" class="fetch-btn">启用扩展</button>
  </div>

  <!-- ═══ 标签切换 ═══ -->
  <div class="tab-bar" role="tablist" aria-label="配置用途">
    <button type="button" class="tab-btn active" id="tab-explain" role="tab" aria-selected="true" aria-controls="panel-explain" data-tab="explain"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 6c-3-3-7-3-10-2v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-3-1-7-1-10 2Zm0 0v15"/></svg>解释</button>
    <button type="button" class="tab-btn" id="tab-translate" role="tab" aria-selected="false" aria-controls="panel-translate" data-tab="translate"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5h12M9 2v3M5 5c1 5 4 8 8 10M13 5c-1 5-4 8-8 10M14 21l4-10 4 10M15.5 18h5"/></svg>全文翻译</button>
  </div>

  <div class="tab-panel active" id="panel-explain" role="tabpanel" aria-labelledby="tab-explain">
    <h2 class="model-heading">当前模型</h2>
    <div class="section field-pair model-pair">
      <div class="manufacturer-field">
        <label class="label visually-hidden" for="explain-manufacturer">模型厂家</label>
        <select id="explain-manufacturer" class="select" aria-controls="explain-model"></select>
      </div>
      <div class="model-field">
        <label class="label visually-hidden" for="explain-model">模型</label>
        <select id="explain-model" class="select" aria-describedby="explain-model-detail"></select>
      </div>
    </div>
    <p id="explain-model-detail" class="hint model-detail"></p>
    <div class="section thinking-section" id="explain-deepseek-thinking-section" hidden>
      <label class="toggle-label">
        <span class="toggle-text">DeepSeek 思考模式</span>
        <input type="checkbox" id="explain-deepseek-thinking" aria-describedby="explain-deepseek-thinking-hint" aria-controls="explain-thinking">
      </label>
      <p class="hint" id="explain-deepseek-thinking-hint">关闭时同时停用深度思考。</p>
    </div>
    <div class="section thinking-section">
      <label class="toggle-label">
        <span class="toggle-text">深度思考</span>
        <input type="checkbox" id="explain-thinking">
      </label>
    </div>
    <div class="section" id="explain-effort-section" style="display:none">
      <label class="label" for="explain-effort">思考强度</label>
      <select id="explain-effort" class="select">
        <option value="high">高</option><option value="medium">中</option><option value="low">低</option>
      </select>
    </div>
    <div class="reading-preferences">
      <div class="language-field">
        <label class="label" for="explain-language">解释语言</label>
        <select id="explain-language" class="select"><option value="auto">自动</option><option value="zh">中文</option><option value="en">English</option></select>
      </div>
      <div class="section" id="trigger-mode-section"><label class="label" for="trigger-mode">划词触发</label><select id="trigger-mode" class="select"><option value="auto">选中即解释</option><option value="contextMenu">仅右键菜单</option></select></div>
    </div>
  </div>

  <div class="tab-panel" id="panel-translate" role="tabpanel" aria-labelledby="tab-translate" hidden>
    <h2 class="model-heading">当前模型</h2>
    <div class="section field-pair model-pair">
      <div class="manufacturer-field">
        <label class="label visually-hidden" for="translate-manufacturer">模型厂家</label>
        <select id="translate-manufacturer" class="select" aria-controls="translate-model"></select>
      </div>
      <div class="model-field">
        <label class="label visually-hidden" for="translate-model">模型</label>
        <select id="translate-model" class="select" aria-describedby="translate-model-detail"></select>
      </div>
    </div>
    <p id="translate-model-detail" class="hint model-detail"></p>
    <div class="section thinking-section" id="translate-deepseek-thinking-section" hidden>
      <label class="toggle-label">
        <span class="toggle-text">DeepSeek 思考模式</span>
        <input type="checkbox" id="translate-deepseek-thinking" aria-describedby="translate-deepseek-thinking-hint" aria-controls="translate-thinking">
      </label>
      <p class="hint" id="translate-deepseek-thinking-hint">关闭时同时停用深度思考。</p>
    </div>
    <div class="section thinking-section">
      <label class="toggle-label">
        <span class="toggle-text">深度思考</span>
        <input type="checkbox" id="translate-thinking">
      </label>
    </div>
    <div class="section" id="translate-effort-section" style="display:none">
      <label class="label" for="translate-effort">思考强度</label>
      <select id="translate-effort" class="select">
        <option value="high">高</option><option value="medium">中</option><option value="low">低</option>
      </select>
    </div>
    <div class="reading-preferences fullpage-preferences">
      <div class="language-field">
        <label class="label" for="target-language">目标语言</label>
        <select id="target-language" class="select" aria-describedby="fullpage-trigger-hint"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="pt">Português</option><option value="ru">Русский</option><option value="ar">العربية</option></select>
        <p class="hint" id="fullpage-trigger-hint">在页面空白处右键，选择「全文翻译」。</p>
      </div>

    </div>
  </div>

  <div class="section key-section">
    <div id="key-editor">
      <label class="label" for="api-key">API Key</label>
      <input type="password" id="api-key" class="input" autocomplete="off" spellcheck="false">
      <div class="key-actions">
        <button type="button" id="save-key" class="mini-btn">保存 API Key</button>
        <button type="button" id="cancel-key" class="mini-btn" hidden>取消</button>
      </div>
      <p id="key-msg" class="inline-error" role="alert"></p>
    </div>
    <div id="key-saved" class="key-saved" hidden><span>API Key 已保存</span><button type="button" id="rewrite-key" class="mini-btn" hidden>重新填写</button></div>
  </div>
  <button type="button" id="custom-connection-button" class="connection-link" hidden>配置自定义接口</button>
  <dialog id="custom-connection-dialog">
    <h2>自定义接口</h2>
    <label class="label" for="api-base-url">接口地址</label>
    <input type="url" id="api-base-url" class="input" placeholder="https://example.com/v1" autocomplete="off">
    <p class="hint">填写服务商提供的兼容地址。</p>
    <p id="custom-msg" class="inline-error" role="alert"></p>
    <div class="key-actions">
      <button type="button" id="custom-save" class="mini-btn">保存地址</button>
      <button type="button" id="custom-cancel" class="mini-btn">取消</button>
    </div>
  </dialog>

  <footer class="settings-footer">
    <div class="theme-section">
      <label class="label visually-hidden" for="ui-theme">主题配色</label>
      <select id="ui-theme" class="select" aria-describedby="theme-status"><option value="cobalt">纸本文笺</option><option value="playful">清浅青</option><option value="vellum">冷灰蓝</option></select>
      <p id="theme-status" class="hint" role="status" aria-live="polite"></p>
    </div>
    <button type="button" id="save-btn" class="save-btn">保存设置<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </footer>
</div>

<script src="model-catalog.js"></script>
<script src="config.js"></script>
<script src="theme.js"></script>
<script src="popup.js"></script>
<script src="select-menu.js"></script>
</body>
</html>
