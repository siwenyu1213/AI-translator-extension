<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能解释 & 翻译</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="container">
  <h1 class="title">AI 智能解释 &amp; 翻译 <span class="version">v4.6.0</span></h1>
  <p id="catalog-status" class="catalog-error" role="alert" hidden></p>
  <div id="disabled-extension" class="section" hidden>
    <p class="hint">扩展当前已停用。</p>
    <button type="button" id="enable-extension" class="fetch-btn">启用扩展</button>
  </div>

  <!-- ═══ 标签切换 ═══ -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="explain">📖 解释</button>
    <button class="tab-btn" data-tab="translate">🌐 全文翻译</button>
  </div>

  <!-- ═══ 解释标签设置 ═══ -->
  <div class="tab-panel active" id="panel-explain">
    <div class="section">
      <label class="label" for="explain-manufacturer">模型厂家</label>
      <select id="explain-manufacturer" class="select" aria-controls="explain-model"></select>
      <label class="label label-spaced" for="explain-model">该厂家模型</label>
      <select id="explain-model" class="select" aria-describedby="explain-model-detail"></select>
      <p id="explain-model-detail" class="hint"></p>

    </div>

    <div class="section">
      <label class="toggle-label">
        <input type="checkbox" id="explain-thinking">
        <span class="toggle-text">深度思考模式</span>
      </label>
      <p class="hint">本试用分支对 DeepSeek 官方接口固定关闭思考，忽略此开关；其他接口仅在支持 reasoning_effort 时开启。</p>
    </div>

    <div class="section" id="explain-effort-section" style="display:none">
      <label class="label" for="explain-effort">思考强度</label>
      <select id="explain-effort" class="select">
        <option value="high">高（推荐）</option>
        <option value="medium">中</option>
        <option value="low">低</option>
      </select>
    </div>

    <div class="section">
      <label class="label" for="explain-language">解释语言偏好</label>
      <select id="explain-language" class="select">
        <option value="auto">自动检测（推荐）</option>
        <option value="zh">始终用中文</option>
        <option value="en">始终用英文</option>
      </select>
    </div>
  </div>

  <!-- ═══ 翻译标签设置 ═══ -->
  <div class="tab-panel" id="panel-translate">
    <div class="section">
      <label class="label" for="translate-manufacturer">模型厂家</label>
      <select id="translate-manufacturer" class="select" aria-controls="translate-model"></select>
      <label class="label label-spaced" for="translate-model">该厂家模型</label>
      <select id="translate-model" class="select" aria-describedby="translate-model-detail"></select>
      <p id="translate-model-detail" class="hint"></p>

    </div>

    <div class="section">
      <label class="toggle-label">
        <input type="checkbox" id="translate-thinking">
        <span class="toggle-text">深度思考模式</span>
      </label>
      <p class="hint">本试用分支对 DeepSeek 官方接口固定关闭思考，忽略此开关；其他接口关闭时使用模型默认行为。</p>
    </div>

    <div class="section" id="translate-effort-section" style="display:none">
      <label class="label" for="translate-effort">思考强度</label>
      <select id="translate-effort" class="select">
        <option value="high">高（推荐）</option>
        <option value="medium">中</option>
        <option value="low">低</option>
      </select>
    </div>

    <div class="section">
      <label class="label" for="target-language">翻译目标语言</label>
      <select id="target-language" class="select">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="ru">Русский</option>
        <option value="ar">العربية</option>
      </select>
    </div>
  </div>

  <div class="section key-section">
    <div id="key-editor">
      <label class="label" for="api-key">API Key</label>
      <input type="password" id="api-key" class="input" autocomplete="off" spellcheck="false">
      <p class="hint">填写所选厂家的 Key，保存后自动收起。</p>
      <div class="key-actions">
        <button type="button" id="save-key" class="mini-btn">保存 API Key</button>
        <button type="button" id="cancel-key" class="mini-btn" hidden>取消</button>
      </div>
      <p id="key-msg" class="inline-error" role="alert"></p>
    </div>
    <button type="button" id="rewrite-key" class="fetch-btn" hidden>重新填写 API Key</button>
  </div>
  <button type="button" id="custom-connection-button" class="connection-link" hidden>配置自定义接口</button>
  <dialog id="custom-connection-dialog">
    <h2>自定义接口</h2>
    <label class="label" for="api-base-url">接口地址</label>
    <input type="url" id="api-base-url" class="input" placeholder="https://example.com/v1" autocomplete="off">
    <p class="hint">填写服务商提供的兼容地址。</p>
    <p id="custom-msg" class="inline-error" role="alert"></p>
    <div class="key-actions">
      <button type="button" id="custom-save" class="mini-btn">保存地址</button>
      <button type="button" id="custom-cancel" class="mini-btn">取消</button>
    </div>
  </dialog>

  <button id="save-btn" class="save-btn">💾 保存设置</button>
  <div id="status" class="status"></div>
</div>

<script src="model-catalog.js"></script>
<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
