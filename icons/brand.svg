<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="8" fill="#e8d85c"/>
  <g fill="#2a3870">
    <path d="M57 37C44 45 36 58 36 72c0 12 6 19 15 19 8 0 13-5 13-12 0-8-5-13-12-13-2 0-4 0-6 1 0-9 4-18 14-27z"/>
    <path d="M86 37C73 45 65 58 65 72c0 12 6 19 15 19 8 0 13-5 13-12 0-8-5-13-12-13-2 0-4 0-6 1 0-9 4-18 14-27z"/>
  </g>
</svg>

<!--
中文逐句导读（不参与运行）
这个文件是设置页、划词浮层和全文工具栏使用的引号品牌图标。
theme.js 提供图标地址，theme.css 把它显示在 lc-brand-icon 元素里。
SVG 用形状和坐标描述图片，可随界面大小缩放；这里不执行 JavaScript。
第 1 行：创建 128 像素的 SVG 画布；viewBox 定义内部坐标范围。
第 2 行：画一个铺满画布的黄色矩形，rx=8 表示圆角半径。
第 3 行：将后面的两条路径组成一组，统一使用深蓝色填充。
第 4 行：画左边的引号；M 移到起点，C/c 画曲线，z 闭合形状，数字是坐标。
第 5 行：用另一组坐标画右边的引号，与左边共同组成品牌标志。
第 6 行：结束统一设置颜色的形状组。
第 7 行：结束图标画布。
-->
